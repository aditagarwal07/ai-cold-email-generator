[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2FF"
textColor = "#172033"
font = "sans serif"

[browser]
gatherUsageStats = false

# Production does not need file-triggered module eviction. Widget reruns still work.
# For local development, override with --server.fileWatcherType auto.
[server]
fileWatcherType = "none"
